[project]
name = "chungyak-alimi"
version = "0.1.0"
description = "공공 오픈API 기반 청약 정보 수집·정제·알림·조회 (라즈베리파이 배포)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "truststore>=0.9",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ruff의 기본 규칙셋(E4/E7/E9/F)으로 고정. 이 리포는 select를 지정한 적이 없어
# 기본값에 의존해왔는데, unpinned `ruff>=0.5`가 새 버전에서 기본 확장 규칙
# (DTZ/BLE/I/C4/SIM 등)을 켜면서 기존 코드 전반이 갑자기 실패했다. 의도했던
# 검사 범위(기존 CI가 green이던)를 명시 고정해 버전 드리프트로부터 보호한다.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
