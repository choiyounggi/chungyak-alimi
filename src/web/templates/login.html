{% extends "base.html" %}
{% block title %}로그인 · 청약 알리미{% endblock %}

{% block head %}
<style>
  /* 로그인 전용: base body는 중앙정렬이 아니므로 이 페이지에서만 flex center */
  body{min-height:100vh;display:flex;align-items:center;justify-content:center}
  /* base .wrap(max-width:840·pad 22/20/72)을 로그인 박스로 재정의 (brief .box{max-width:380px} 실현) */
  main.wrap{width:100%;max-width:380px;padding:24px 20px}
  /* 브랜드 영역 중앙정렬 + 포인트 teal 타이틀 */
  .login-head{text-align:center;margin-bottom:var(--s-lg)}
  .login-head h1{color:var(--accent-teal)}
  /* 경고 배너: 아이콘+텍스트 정렬(기존 login의 flex 정렬 보존; base .form-error는 display:block) */
  .form-error{display:flex;gap:var(--s-xs);align-items:center}
  /* 제출 버튼 풀폭(base .btn은 inline-flex) */
  form .btn-primary{width:100%;margin-top:var(--s-xxs)}
  /* 폼 하단 전환 링크(회원가입) */
  .form-foot{margin-top:var(--s-md);text-align:center;font-size:14px;color:var(--muted)}
</style>
{% endblock %}

{% block topbar %}{% endblock %}

{% block content %}
<div class="login-head">
  <h1>청약 알리미</h1>
  <p class="sub">내 관심 청약을 한눈에</p>
</div>
<!-- novalidate: 브라우저 기본 검증 팝업(시스템 알럿) 비활성화 → 서버 인라인 에러로 안내 -->
<form method="post" action="/login" novalidate>
  {% if error %}
  <!-- 서버가 정한 고정 문구만 표시(사용자 입력 반사 금지). 필드 단위로 나눌 수 없는
       폼 전체 오류이므로 제출 버튼 위 폼 레벨 영역에 둔다. -->
  <div class="form-error" id="login-error" role="alert">
    <svg class="ic" aria-hidden="true"><use href="#i-alert"></use></svg>{{ error }}
  </div>
  {% endif %}
  <div class="field">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="email"
           value="{{ email or '' }}" autofocus
           {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
  </div>
  <button type="submit" class="btn btn-primary">로그인</button>
</form>
<p class="form-foot">아직 계정이 없으신가요? <a href="/register">회원가입</a></p>
{% endblock %}
